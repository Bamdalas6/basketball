<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arcade Basketball</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <div id="game-frame">
      <!-- 3D WebGL Canvas Layer -->
      <div id="canvas-container"></div>

      <!-- Top HUD: Just YOU and your Score -->
      <div id="hud-header">
        <!-- Player Avatar on Left -->
        <div class="avatar-badge">
          <div class="avatar-circle">
            <svg class="avatar-svg" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="38" fill="#a16207"/>
              <path d="M20 50 Q16 20 50 16 Q84 20 80 50" fill="#3f2305"/>
              <ellipse cx="38" cy="46" rx="4" ry="4" fill="#000"/>
              <path d="M58 46 Q64 42 70 46" stroke="#000" stroke-width="4" stroke-linecap="round" fill="none"/>
              <path d="M36 60 Q50 74 64 60 Z" fill="#7f1d1d"/>
              <path d="M44 64 Q50 78 56 64 Z" fill="#f43f5e"/>
            </svg>
          </div>
          <span class="avatar-label">You</span>
        </div>

        <!-- Central Scoreboard -->
        <div id="scoreboard-casing">
          <div class="score-cell">
            <span class="score-title">SCORE</span>
            <span id="score-player" class="led-number">0</span>
          </div>

          <div class="score-divider"></div>

          <div class="score-cell">
            <span class="score-title">BEST</span>
            <span id="score-best" class="led-number led-yellow">0</span>
          </div>
        </div>

        <!-- Controls on Right -->
        <div class="hud-controls">
          <button id="btn-sound" class="mini-btn" title="Toggle Sound">🔊</button>
          <button id="btn-restart" class="mini-btn" title="Reset Score">🔄</button>
        </div>
      </div>

      <!-- Streak & Combo Overlay -->
      <div id="streak-badge">STREAK x3 🔥</div>
      <div id="combo-banner">SWISH!</div>

      <!-- Swipe Guidance Hint -->
      <div id="swipe-hint">
        <div class="hint-arrow"></div>
        <span>SWIPE UP TO SHOOT</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
